<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CS330 Quiz Bank</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky set index on the left, one reading column of question cards; stacks to a single column on phones. */
:root{
  --bg:#eef1f5; --surface:#ffffff; --sunk:#f5f7fa; --ink:#141c28; --muted:#566275; --line:#d6dce5;
  --accent:#1c56c9; --accent-ink:#ffffff; --accent-soft:#e2eafb;
  --ok:#17744a; --ok-soft:#e1f2e8; --bad:#b03228; --bad-soft:#f7e3e1; --warn:#835400; --warn-soft:#fbefd6;
  --paper:#ffffff;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e131a; --surface:#161d27; --sunk:#111821; --ink:#e4e9f0; --muted:#97a2b3; --line:#2a3443;
  --accent:#7ea6ff; --accent-ink:#0b1220; --accent-soft:#1a2842;
  --ok:#5fca8f; --ok-soft:#14301f; --bad:#ff8c80; --bad-soft:#3a1c19; --warn:#e9b55c; --warn-soft:#33280f;
  --paper:#e8ecf1; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e131a; --surface:#161d27; --sunk:#111821; --ink:#e4e9f0; --muted:#97a2b3; --line:#2a3443;
  --accent:#7ea6ff; --accent-ink:#0b1220; --accent-soft:#1a2842;
  --ok:#5fca8f; --ok-soft:#14301f; --bad:#ff8c80; --bad-soft:#3a1c19; --warn:#e9b55c; --warn-soft:#33280f;
  --paper:#e8ecf1; color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.55;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:20px 48px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
code{font-family:var(--f-mono);font-size:.88em;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:0 .3em}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;gap:14px 32px;align-items:flex-end;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand{min-width:0;max-width:640px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.brand h1{font-size:clamp(26px,3.2vw,34px);font-weight:700;letter-spacing:-.015em;margin-top:6px}
.brand p{margin:10px 0 0;color:var(--muted);max-width:60ch}
.score{display:flex;gap:22px;align-items:flex-end}
.stat{display:grid;gap:2px}
.stat b{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.stat span{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:18px}
.meter i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}

/* toolbar */
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;margin:14px 0 20px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toggle{display:inline-flex;gap:8px;align-items:center;font-size:13.5px;cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent);width:16px;height:16px}
.ghost{border:1px solid var(--line);background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13.5px}
.ghost:hover{background:var(--surface)}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:13.5px}

/* layout: one question stage + question map */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:36px;align-items:start}
main{min-width:0;display:grid;gap:16px;scroll-margin-top:16px}

.where{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between}
.where .paper{display:grid;gap:3px;min-width:0}
.where .eyebrow{color:var(--accent)}
.where h2{font-size:22px;font-weight:700}
.where .pos{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.where .pos b{color:var(--ink);font-weight:500}
.warnline{color:var(--ink);background:var(--warn-soft);border-radius:8px;padding:8px 12px;font-size:14px}

.stepper{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding-top:4px}
.stepper .right{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-left:auto}
.btn.big{padding:11px 22px;font-size:15px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.skip{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13.5px;padding:6px}
.kbd{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}

aside.map{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 16px}
aside.map .lbl{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mp{display:grid;gap:6px}
.mp-h{display:flex;justify-content:space-between;gap:8px;font-size:13px;line-height:1.3}
.mp-h span:first-child{min-width:0}
.mp-h .k{font-family:var(--f-mono);color:var(--accent);font-weight:500;margin-right:6px}
.mp-h .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.dots{display:flex;flex-wrap:wrap;gap:4px}
.dot{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--sunk);font-family:var(--f-mono);font-size:11px;font-variant-numeric:tabular-nums;cursor:pointer;display:grid;place-items:center;padding:0;color:var(--muted)}
.dot:hover{border-color:var(--accent)}
.dot.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 50%,var(--line));color:var(--ok)}
.dot.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 50%,var(--line));color:var(--bad)}
.dot.shown{background:var(--accent-soft);color:var(--accent)}
.dot.cur{outline:2px solid var(--ink);outline-offset:1px;color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.legend .l-ok{background:var(--ok-soft);border-color:var(--ok)} .legend .l-bad{background:var(--bad-soft);border-color:var(--bad)} .legend .l-sh{background:var(--accent-soft);border-color:var(--accent)}

.endcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:grid;gap:16px}
.endcard h2{font-size:26px}
.endcard table{border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.endcard td,.endcard th{padding:6px 14px 6px 0;text-align:left;border-bottom:1px solid var(--line)}
.endcard th{font-weight:600;color:var(--muted);font-size:12.5px;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.05em}

/* question card */
article.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:grid;gap:14px;min-width:0}
article.q.is-ok{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
article.q.is-bad{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.qmeta{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.02em}
.qmeta .id{color:var(--ink);font-weight:500}
.qmeta .tag{border:1px solid var(--line);border-radius:4px;padding:0 6px}
.qmeta .tag.x{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.qtext{font-size:16px;max-width:72ch}
.qtext b{font-weight:600}
figure{margin:0;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px;max-width:640px}
figure img{display:block;width:100%;height:auto;border-radius:4px}
figure figcaption{font-family:var(--f-mono);font-size:11.5px;color:#4a5566;margin-top:6px}
pre.cap{margin:0;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-family:var(--f-mono);font-size:12.5px;line-height:1.6;overflow-x:auto;white-space:pre}

/* options */
.opts{display:grid;gap:8px;max-width:760px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:10px 12px;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .L{font-family:var(--f-mono);font-weight:500;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font-size:12.5px}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .L{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .L{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.opts.tf{grid-template-columns:repeat(2,minmax(0,160px))}

/* match */
.match{display:grid;gap:8px;max-width:820px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,260px) 22px;gap:12px;align-items:center;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:8px 10px}
.mrow select{width:100%;font:inherit;font-size:14px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.mrow .mk{font-family:var(--f-mono);font-weight:600;text-align:center}
.mrow.right{border-color:var(--ok)} .mrow.right .mk{color:var(--ok)}
.mrow.wrong{border-color:var(--bad)} .mrow.wrong .mk{color:var(--bad)}

/* written */
textarea{width:100%;max-width:760px;min-height:64px;font:inherit;font-size:14.5px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);resize:vertical}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:0;background:var(--accent);color:var(--accent-ink);padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.ok{background:var(--ok-soft);color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 40%,transparent)}
.btn.bad{background:var(--bad-soft);color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.hint{font-size:13px;color:var(--muted)}

/* solution */
.sol{border-top:1px dashed var(--line);padding-top:14px;display:grid;gap:12px}
.verdict{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;width:max-content}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.verdict.neutral{background:var(--accent-soft);color:var(--accent)}
.ans{font-size:16px;max-width:76ch}
.ans .k{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}
.why{max-width:72ch;color:var(--ink)}
.why .k,.srcs .k{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
.note{background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:14px;max-width:76ch}
.note b.k{color:var(--warn);font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
.srcs ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.srcs li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:baseline;font-size:14px}
.srcs li::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--accent);transform:translateY(-1px)}
.srcs li.out::before{background:var(--warn)}
table.mini{border-collapse:collapse;font-size:14px;margin-top:4px;min-width:420px}
table.mini th,table.mini td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
table.mini th{background:var(--sunk);font-weight:600}
.tw{overflow-x:auto;max-width:100%}
.empty{color:var(--muted);padding:20px 0}

@media (max-width:900px){
  .grid{grid-template-columns:minmax(0,1fr)}
  aside.map{position:static}
}
@media (max-width:560px){
  .wrap{padding-inline:16px}
  article.q{padding:16px 14px}
  .mrow{grid-template-columns:minmax(0,1fr) 22px}
  .mrow select{grid-column:1/2;grid-row:2}
  .mrow .mk{grid-row:1/3;grid-column:2}
  .score{gap:16px}
  .opts.tf{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
html{scroll-behavior:smooth}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="eyebrow">CS330 · Computer Networks · Quiz 1 practice</div>
      <h1>CS330 Quiz Bank</h1>
      <p>One question at a time. Answer it, read the solution and its source, then move on. Page numbers refer to <code>Quiz1_3rd_2024_merged.pdf</code>.</p>
    </div>
    <div>
      <div class="score" aria-live="polite">
        <div class="stat"><b id="s-done">0</b><span>answered</span></div>
        <div class="stat"><b id="s-right">0</b><span>correct</span></div>
        <div class="stat"><b id="s-total">0</b><span>questions</span></div>
      </div>
      <div class="meter" aria-hidden="true"><i id="s-bar"></i></div>
    </div>
  </header>

  <div class="bar">
    <div class="chips" role="group" aria-label="Filter by chapter">
      <button class="chip" data-f="all" aria-pressed="true">All</button>
      <button class="chip" data-f="1" aria-pressed="false">Chapter 1 · Introduction</button>
      <button class="chip" data-f="2" aria-pressed="false">Chapter 2 · Application layer</button>
      <button class="chip" data-f="x" aria-pressed="false">Later chapters</button>
      <button class="chip" data-f="todo" aria-pressed="false">Not answered yet</button>
      <button class="chip" data-f="wrong" aria-pressed="false">Ones I missed</button>
    </div>
    <div class="tools">
      <label class="toggle"><input type="checkbox" id="study"> Study mode (show all answers)</label>
      <span id="resetbox"><button class="ghost" id="reset">Reset progress</button></span>
    </div>
  </div>

  <div class="grid">
    <main id="main"></main>
    <aside class="map" id="map" aria-label="Question map"></aside>
  </div>
</div>

{id:'A1a', set:'A', page:'1', ch:'1', type:'written',
 q:`Two routers A and B are connected by a link with transmission rate <b>100 Mbps</b> and length <b>2000 km</b>. The propagation speed is <b>2.5×10<sup>6</sup> m/s</b>. You send a packet of <b>200 Kbits</b> from A to B. What is the <b>propagation delay</b>?`,
 answer:`d<sub>prop</sub> = d / s = 2,000,000 m ÷ 2.5×10<sup>6</sup> m/s = <b>0.8 s (800 ms)</b>`,
 exp:`Propagation delay depends only on the link length and the propagation speed, so the 100 Mbps rate and the 200 Kbit packet size are distractors (they would give the transmission delay, L/R = 2 ms). Convert km to m first: 2000 km = 2×10<sup>6</sup> m.`,
 note:`The paper prints 2.5×10<sup>6</sup> m/s. If your instructor meant the usual 2.5×10<sup>8</sup> m/s, the answer would be 2×10<sup>6</sup> ÷ 2.5×10<sup>8</sup> = 0.008 s (8 ms).`,
 src:[S1(50)+' — d<sub>prop</sub> = d/s', 'Tutorial 1 · Chapter 1, Q1 and Q3 use the same formula']},

{id:'A1b', set:'A', page:'1', ch:'2', type:'written',
 q:`A network has <b>750 requests per second</b>, each request is <b>2 KB</b> (2 kilobytes), and the link capacity is <b>10 Mbps</b>. What is the traffic intensity (utilization) of the link?`,
 answer:`Traffic intensity = La / R = (750 × 16,000 bits) / 10×10<sup>6</sup> bps = 12 Mbps / 10 Mbps = <b>1.2</b>`,
 exp:`First turn bytes into bits: 2 KB = 2 × 1000 × 8 = 16,000 bits. The arrival rate of bits is 750 × 16,000 = 12,000,000 bps = 12 Mbps. Divide by the link rate. Because the value is greater than 1, more work arrives than the link can serve, so the queue grows without limit and the average queueing delay goes to infinity.`,
 note:`If you use 1 KB = 1024 bytes you get 12.29 Mbps / 10 Mbps ≈ 1.23. Either way it is above 1.`,
 src:[S1(53)+' — traffic intensity = La/R; La/R > 1 means average delay is infinite', S2(37)+' — access link utilization example', 'Tutorial 1 · Chapter 2, Q2a (750 requests/s, same method, answer 75%)']},

{id:'A1c', set:'A', page:'1', ch:'2', type:'written',
 q:`How many RTTs are needed to download a web page that consists of a base page and <b>5 objects</b>, if the connection is <b>persistent and without pipelining</b>?`,
 answer:`1 RTT (TCP setup) + 1 RTT (base HTML) + 5 × 1 RTT (one per object) = <b>7 RTT</b>`,
 exp:`Persistent HTTP opens the TCP connection once and keeps it open, so only the first object pays the extra RTT for the handshake. Without pipelining, the client waits for each response before sending the next request, so each of the 5 objects costs one more RTT.`,
 src:[S2(20)+' — persistent vs non-persistent HTTP', S2(23)+' — one RTT to initiate TCP, one RTT per request/response', S2(24)+' — persistent HTTP keeps the connection open', 'Tutorial 1 · Chapter 2, Q1c (page + 3 images, persistent without pipelining = 5 RTT)']},

{id:'A2-1', set:'A', page:'1', ch:'1', type:'match',
 q:`For each device, determine the <b>highest layer</b> it works on.`,
 rows:['Router','Server','Link-layer switch','Smartphone'],
 choices:['Application layer','Transport layer','Network layer','Link layer','Physical layer'],
 ans:[2,0,3,0],
 answer:`Router → Network · Server → Application · Link-layer switch → Link · Smartphone → Application`,
 exp:`End systems (hosts) such as servers and smartphones run applications, so they implement all five layers. A router implements network, link and physical, so its highest layer is network. A link-layer switch implements only link and physical.`,
 src:[S1(69)+' — encapsulation end-to-end view: router has network/link/physical, switch has link/physical', S1(64)+' — the five-layer Internet stack', S2(5)+' — network-core devices do not run user applications']},

{id:'A2-2', set:'A', page:'2', ch:'1', type:'match',
 q:`Match each networking concept with its correct description.`,
 rows:['Throughput','Circuit switching','Packet switching','Propagation delay'],
 choices:['1. Resources (bandwidth, buffers) are reserved end-to-end','2. Time for one bit to travel across the physical link','3. The average rate at which bits are successfully delivered over a link','4. Packets may take different routes, causing variable delay'],
 ans:[2,0,3,1],
 answer:`Throughput → 3 · Circuit switching → 1 · Packet switching → 4 · Propagation delay → 2`,
 exp:`Throughput is the rate at which bits get from sender to receiver. Circuit switching reserves end-to-end resources for the call. In packet switching each packet is forwarded hop by hop and can be queued, so delay varies. Propagation delay is d/s, the time for a bit to cross the link.`,
 src:[S1(56)+' — throughput definition', S1(33)+' — circuit switching: end-end resources reserved', S1(25)+' and '+S1(36)+' — packet switching, congestion and variable delay', S1(50)+' — propagation delay']},

{id:'A2-3a', set:'A', page:'2', ch:'2', type:'written',
 q:`The following was captured by Wireshark:`,
 code:`HTTP/1.1 200 OK\\r\\n
Date: Tue, 23 SEP 2025 17:11:13 GMT\\r\\n
Server: Apache/2.4.6 (CentOS) OpenSSL/1.0.2k-fips PHP/5.4.16 mod_perl/2.0.11 Perl/v5.16.3\\r\\n
Content-Length: 209\\r\\n
Keep-Alive: timeout=5, max=100\\r\\n
Connection: Keep-Alive\\r\\n
Content-Type: text/html; charset=iso-8859-1\\r\\n
\\r\\n`,
 q2:`(a) Was the server able to successfully find the file or not? Say where in the message you found the answer.`,
 answer:`<b>Yes.</b> The status line <code>HTTP/1.1 200 OK</code> says the request succeeded.`,
 exp:`The first line of a response is the status line: protocol version, status code, status phrase. Code 200 means "request succeeded, requested object later in this message". If the file were missing the server would send 404 Not Found.`,
 note:`The question calls this the GET message, but what is shown is the server's <i>response</i> (it starts with a status line, not a GET request line).`,
 src:[S2(28)+' — HTTP response message, status line', S2(29)+' — 200 OK vs 404 Not Found']},

{id:'A2-3b', set:'A', page:'2', ch:'2', type:'written',
 q:`(Same capture as above.) Is the connection non-persistent or persistent? Say how you got your answer.`,
 answer:`<b>Persistent.</b> The header lines <code>Connection: Keep-Alive</code> and <code>Keep-Alive: timeout=5, max=100</code> show the server will keep the TCP connection open.`,
 exp:`With non-persistent HTTP the server closes the TCP connection after one object (it would send <code>Connection: close</code>). Here the server says it keeps the connection alive for 5 seconds and up to 100 more requests. The version HTTP/1.1 also uses persistent connections by default.`,
 src:[S2(20)+' — two types of HTTP connections', S2(24)+' — persistent HTTP (HTTP 1.1): server leaves connection open', S2(25)+' — "Connection: keep-alive" header line']},

<tr><td>NS</td><td>A domain, e.g. <code>networkutopia.com</code></td><td>Hostname of the authoritative name server for that domain, e.g. <code>dns1.networkutopia.com</code></td></tr>

{id:'B1-1', set:'B', page:'3', ch:'1', type:'mcq', opts:['True','False'], ans:0,
 q:`Packet switching is based on resource sharing between all users; it is also more efficient than circuit switching in terms of resource utilization.`,
 exp:`Packet switching shares link capacity on demand. In the slide example a 1 Gb/s link supports only 10 users with circuit switching, but 35 users with packet switching with very small probability of overload.`,

{id:'B1-2', set:'B', page:'3', ch:'1', type:'mcq', opts:['True','False'], ans:1,
 q:`<b>Routing</b> is the local action of moving arriving packets from a router's input link to the appropriate output link, while <b>forwarding</b> is the global action of determining the source-destination paths taken by packets.`,
 exp:`The definitions are swapped. <b>Forwarding</b> is the local action (input link → output link, using the forwarding table). <b>Routing</b> is the global action of determining source-to-destination paths.`,

{id:'B1-3', set:'B', page:'3', ch:'1', type:'mcq', opts:['True','False'], ans:1,
 q:`Wireless links are the best transmission media in terms of transmission rate and reliability.`,
 exp:`Fiber optic cable is the best on both counts: 10s–100s Gbps, low error rate, immune to electromagnetic noise. Wireless radio suffers from reflection, obstruction and interference, and WiFi runs at 10–100s Mbps.`,
 src:[S1(22)+' — fiber optic cable', S1(23)+' — wireless radio and its propagation problems']},
{id:'B1-4', set:'B', page:'3', ch:'1', type:'mcq', opts:['True','False'], ans:1,
 q:`In the context of networking model layers, <b>switches</b> work on the three lower layers.`,
 exp:`A link-layer switch implements only the <b>link and physical</b> layers (two layers). It is the <b>router</b> that implements the three lower layers (network, link, physical).`,
 src:[S1(69)+' — switch: link + physical; router: network + link + physical']},
{id:'B1-5', set:'B', page:'3', ch:'1', type:'mcq', opts:['True','False'], ans:1,
 q:`The main function of the network layer in the OSI reference model is process-to-process data transfer.`,
 exp:`Process-to-process data transfer is the <b>transport</b> layer's job (TCP, UDP). The network layer routes datagrams from source host to destination host.`,
 src:[S1(64)+' — layer functions', S1(72)+' — the seven-layer OSI model shares these lower layers']},
{id:'B1-6', set:'B', page:'3', ch:'2', type:'mcq', opts:['True','False'], ans:0,
 q:`Streaming video and audio applications are loss-tolerant applications, meaning they accept some loss of their data.`,
 exp:`The transport-requirements table lists streaming audio/video as loss-tolerant, unlike file transfer, e-mail and web documents, which need no loss.`,
 src:[S2(13)+' — transport service requirements of common apps', S2(12)+' — "other apps (e.g., audio) can tolerate some loss"']},
{id:'B1-7', set:'B', page:'3', ch:'1', type:'mcq', opts:['True','False'], ans:1,
 q:`The main function of the application layer is to establish an end-to-end connection between applications.`,
 exp:`The application layer supports network applications (HTTP, SMTP, DNS) by exchanging messages. Setting up a connection between processes is done by the <b>transport</b> layer: TCP is connection-oriented.`,
 src:[S1(64)+' — application layer: supporting network applications', S2(14)+' — TCP: connection-oriented, setup required']},
{id:'B1-8', set:'B', page:'3', ch:'1', type:'mcq', opts:['True','False'], ans:0,
 q:`In circuit switching, Frequency Division Multiplexing (FDM) and Time Division Multiplexing (TDM) are two approaches for implementing this technique.`,
 exp:`The slides present FDM (each call gets its own frequency band) and TDM (each call gets periodic time slots) as the two ways to build circuits on a link.`,
 src:[S1(34)+' — Circuit switching: FDM and TDM']},

{id:'B2-1', set:'B', page:'3', ch:'1', type:'mcq',
 q:`What is the packet delay component computed as the time spent waiting in packet buffers for link transmission?`,
 opts:['Queueing delay','Propagation delay','Processing delay','Transmission delay'], ans:0,
 exp:`d<sub>queue</sub> is the time a packet waits at the output link for transmission; it depends on how congested the router is.`,
 src:[S1(49)+' — d<sub>queue</sub>: time waiting at output link for transmission', S1(47)+' — packets in buffers = queueing delay']},
{id:'B2-2', set:'B', page:'3', ch:'1', type:'mcq', also:'29',
 q:`Which of the definitions below describes what is meant by the term <b>"encapsulation"</b>?`,
 opts:['Receiving a "packet" from the layer below, extracting the payload field, and after some internal actions possibly delivering that payload to an upper layer protocol.','Starting a transport layer timer for a transmitted segment, and then if an ACK segment isn\'t received before the timeout, placing that segment in a retransmission queue.','Computing the sum of all of the bytes within a packet and placing that value in the packet header field.','Taking data from the layer above, adding header fields appropriate for this layer, and then placing the data in the payload field of the "packet" for that layer.','Determining the name of the destination host, translating that name to an IP address and then placing that value in a packet header field.'],
 ans:3,
 exp:`Each layer takes what the layer above gives it and wraps it with its own header: the transport layer adds H<sub>t</sub> to the message M to make a segment, the network layer adds H<sub>n</sub> to make a datagram, and so on. Option A describes the reverse (decapsulation).`,
 src:['Chapter 1 slides · slides 65–67 — Services, layering and encapsulation']},
{id:'B2-3', set:'B', page:'3–4', ch:'1', type:'mcq',
 q:`Within the TCP/IP model layers, where does a <b>router</b>, functioning as a computer networking device, primarily operate?`,
 opts:['The three upper layers','In application layer','The three lower layers','Physical layer'], ans:2,
 exp:`A router implements the network, link and physical layers, the three lower layers of the five-layer stack. It does not run transport or application layers for the traffic it forwards.`,
 src:[S1(69)+' — router: network / link / physical']},
{id:'B2-4', set:'B', page:'4', ch:'1', type:'mcq',
 q:`Which of these is <b>not</b> a guided medium?`,
 opts:['Fiber optical cable','Coaxial cable','Wireless LAN','Copper wire'], ans:2,
 exp:`Guided media carry signals in solid media: copper, fiber, coax. Unguided media let signals propagate freely, e.g. radio. A wireless LAN uses radio.`,
 src:[S1(21)+' — guided vs unguided media', S1(23)+' — wireless radio, WiFi']},
{id:'B2-5', set:'B', page:'4', ch:'2', type:'mcq', also:'28',
 q:`What is the purpose of the <b>conditional</b> HTTP GET request message?`,
 opts:['To allow a server to only send the requested object to the client if the client has never requested that object before.','To allow a server to only send the requested object to the client if the server is not overloaded.','To allow a server to only send the requested object to the client if the client is authorized to receive that object.','To allow a server to only send the requested object to the client if this object has changed since the server last sent this object to the client.'],
 ans:3,
 exp:`The goal of conditional GET is: don't send the object if the cache already has an up-to-date copy. The client includes <code>If-modified-since: &lt;date&gt;</code>; the server replies <code>304 Not Modified</code> with no object if nothing changed, or <code>200 OK</code> with the object if it was modified.`,
 src:[S2(41)+' — Conditional GET']},
{id:'B2-6', set:'B', page:'4', ch:'2', type:'mcq',
 q:`Which response code in an HTTP response message means that the request is bad and not understood by the server?`,
 opts:['200','404','400','505'], ans:2,
 exp:`400 Bad Request: "request msg not understood by server". 200 is OK, 404 is Not Found, 505 is HTTP Version Not Supported.`,
 src:[S2(29)+' — HTTP response status codes']},

{id:'B3-1', set:'B', page:'4', ch:'1', type:'mcq', fig:'links3',
 q:`A client sends packets of length L bytes over link 1, link 2 and link 3 to the server. Packet length is <b>32000 bytes</b>, propagation speed is 3×10<sup>8</sup> m/s.<br><br>Compute the <b>transmission delay at link 1</b>.`,
 opts:['0.128 msec','0.032 msec','0.256 msec','32 sec','256 sec'], ans:2,
 exp:`L = 32,000 bytes × 8 = 256,000 bits. Link 1 rate R = 1000 Mbps = 10<sup>9</sup> bps.<br>d<sub>trans</sub> = L/R = 256,000 / 10<sup>9</sup> = 0.000256 s = <b>0.256 msec</b>. Option B (0.032 msec) is what you get if you forget to convert bytes to bits.`,
 src:[S1(50)+' — d<sub>trans</sub> = L/R', S1(30)+' — one-hop numerical example']},
{id:'B3-2', set:'B', page:'4', ch:'1', type:'mcq', fig:'links3',
 q:`(Same figure.) Compute the <b>propagation delay for link 2</b>.`,
 opts:['0.01667 msec','0.01667 sec','0.5 sec','0.5 msec','0.05 msec'], ans:1,
 exp:`Link 2 length = 5000 km = 5×10<sup>6</sup> m.<br>d<sub>prop</sub> = d/s = 5×10<sup>6</sup> / 3×10<sup>8</sup> = <b>0.01667 s</b> (16.67 ms). The value is the same number as option A, but A has the wrong unit.`,
 src:[S1(50)+' — d<sub>prop</sub> = d/s']},
{id:'B3-3', set:'B', page:'5', ch:'1', type:'mcq', fig:'links3',
 q:`(Same figure.) What is the maximum end-to-end achievable data rate the client can send to the server?`,
 opts:['1000 Mbps','100 Mbps','10 Mbps','1110 Mbps','1 Mbps'], ans:2,
 exp:`End-to-end throughput is limited by the slowest link on the path, the bottleneck: min(1000, 10, 100) Mbps = <b>10 Mbps</b> (link 2).`,
 src:[S1(57)+' — bottleneck link', S1(58)+' — end-end throughput = min of the link rates']},
{id:'B3-4', set:'B', page:'5', ch:'1', type:'mcq', fig:'links3',
 q:`Suppose the client sends data at the maximum achievable data rate. What is the utilization (U) of <b>link 3</b>?`,
 opts:['U = 1','U = 100','U = 0.10','U = 10','U = 1000'], ans:2,
 exp:`The client can only push 10 Mbps end to end (previous question), so link 3 carries 10 Mbps out of its 100 Mbps capacity: U = arrival rate of bits / link rate = 10 / 100 = <b>0.10</b>.`,
 src:[S1(53)+' — traffic intensity La/R (arrival rate of bits / service rate)', S2(37)+' — "access link utilization" computed as data rate / link rate']},
{id:'B3-5', set:'B', page:'5', ch:'1', type:'written', fig:'links3',
 q:`Suppose the total delays for links 1, 2, 3 are <b>10, 20, 30 msec</b> respectively. What is the end-to-end delay from the client to the server?`,
 answer:`End-to-end delay = 10 + 20 + 30 = <b>60 msec</b>`,
 exp:`Each hop adds its own nodal delay (processing + queueing + transmission + propagation). The packet crosses the three links one after another (store-and-forward), so the end-to-end delay is the sum of the per-link delays.`,
 src:[S1(49)+' — d<sub>nodal</sub> per hop', S1(30)+' — store and forward', 'Tutorial 1 · Chapter 1, Q4 (adding per-hop delays along a path)']},

{id:'B4-1', set:'B', page:'5', ch:'2', type:'written', fig:'dnshttp',
 q:`You click a link to a Web page. The IP address isn't cached on your host, so a DNS lookup is needed. Only one DNS server (the local DNS cache) is visited, with RTT<sub>0</sub> = <b>3 ms</b>. The page has exactly one object (a small HTML file). RTT between the host and the Web server: RTT<sub>HTTP</sub> = <b>27 ms</b>.<br><br>(1) Assuming zero transmission time for the HTML object, how much time (in msec) elapses from the click until the client receives the object?`,
 answer:`RTT<sub>0</sub> + 2·RTT<sub>HTTP</sub> = 3 + 2(27) = <b>57 ms</b>`,
 exp:`First the DNS query to the local DNS server: 3 ms. Then HTTP needs 1 RTT to set up the TCP connection and 1 RTT for the request and response: 2 × 27 = 54 ms. Transmission time is zero.`,
 src:[S2(50)+' — the host sends its DNS query to the local DNS server', S2(23)+' — non-persistent HTTP response time = 2RTT + transmission time']},
{id:'B4-2', set:'B', page:'5', ch:'2', type:'written', fig:'dnshttp',
 q:`(2) The HTML object now references <b>10 very small objects</b> on the same server. Neglecting transmission times, how much time elapses until the base object and all 10 objects are received, with <b>non-persistent HTTP and no parallel TCP connections</b>?`,
 answer:`3 + 2(27) + 10 × 2(27) = 3 + 54 + 540 = <b>597 ms</b>`,
 exp:`Non-persistent HTTP needs 2 RTTs per object (new TCP connection + request/response). The base page costs 2 RTTs, then each of the 10 objects costs another 2 RTTs one after another.`,
 src:[S2(22)+' — "steps 1–5 repeated for each of 10 jpeg objects"', S2(24)+' — non-persistent HTTP requires 2 RTTs per object', 'Tutorial 1 · Chapter 2, Q1b (non-persistent, no parallel connections)']},
{id:'B4-3', set:'B', page:'5', ch:'2', type:'written', fig:'dnshttp',
 q:`(3) Same 10 objects, but the client supports up to <b>5 parallel TCP connections</b> with <b>non-persistent HTTP</b>.`,
 answer:`3 + 2(27) + 2 × 2(27) = 3 + 54 + 108 = <b>165 ms</b>`,
 exp:`After the base page (DNS + 2 RTTs), the 10 objects are fetched 5 at a time, so two rounds. Each round uses new non-persistent connections, so each costs 2 RTTs.`,
 src:[S2(24)+' — browsers open multiple parallel TCP connections', S2(23)+' — 2 RTTs per non-persistent fetch']},
{id:'B4-4', set:'B', page:'5', ch:'2', type:'written', fig:'dnshttp',
 q:`(4) Same 10 objects, up to <b>5 parallel TCP connections</b>, with <b>persistent HTTP</b>.`,
 answer:`3 + 2(27) + 2 × 27 = 3 + 54 + 54 = <b>111 ms</b>`,
 exp:`DNS (3 ms) + 2 RTTs for the base page. With persistent HTTP the connections stay open, so each object costs only 1 RTT (request + response), with no new TCP handshake. The 10 objects go out 5 at a time over the 5 parallel connections, so 2 rounds × 27 ms = 54 ms.`,
 note:`The limit of 5 parallel connections only matters if each connection carries one request at a time, which is why the rounds are counted. If your instructor instead assumes pipelining (all 10 requests sent back-to-back), the slide says this takes "as little as one RTT for all the referenced objects": 3 + 54 + 27 = 84 ms.`,
 src:[S2(24)+' — persistent HTTP: server leaves connection open; subsequent requests sent over the open connection', S2(23)+' — 1 RTT per request/response once the connection exists']},
{id:'B4-5', set:'B', page:'5', ch:'2', type:'mcq', fig:'dnshttp',
 q:`(5) What's the fastest method we've explored?`,
 opts:['Nonpersistent-serial','Nonpersistent-parallel','Persistent-parallel'], ans:2,
 exp:`From parts 2–4: non-persistent serial = 597 ms, non-persistent parallel = 165 ms, persistent parallel = 111 ms (84 ms with pipelining). Persistent connections remove the TCP setup RTT for every object, and parallel connections overlap the requests.`,
 src:[S2(24)+' — persistent HTTP cuts response time']},

{id:'C4a', set:'C', page:'6', ch:'1', type:'written', fig:'hostab',
 q:THREE_LINK+`<br><br>(a) Transmission delay of <b>link 2</b> = ? seconds`,
 answer:`d<sub>trans</sub> = L/R = 4000 / 30×10<sup>6</sup> = <b>1.333×10<sup>-4</sup> s (0.000133 s)</b>`,
 exp:`Transmission delay uses the packet length and the rate of the link being transmitted onto. Link 2 runs at 30 Mbps.`,

{id:'C4b', set:'C', page:'6', ch:'1', type:'written', fig:'hostab',
 q:`(Same setup.) (b) What is the <b>total delay of link 2</b>? (seconds)`,
 answer:`d<sub>trans</sub> + d<sub>prop</sub> = 0.000133 + (5×10<sup>6</sup> / 2×10<sup>8</sup>) = 0.000133 + 0.025 = <b>0.025133 s</b>`,
 exp:`With no processing or queueing delay given, the delay for a link is transmission plus propagation. Propagation: 5000 km = 5×10<sup>6</sup> m, divided by 2×10<sup>8</sup> m/s gives 0.025 s.`,

{id:'C4c', set:'C', page:'6', ch:'1', type:'written', fig:'hostab',

 answer:`La/R = (10 × 4000) / 30×10<sup>6</sup> = <b>0.00133</b> (1.33×10<sup>-3</sup>)`,
 exp:`Packets queue at a router's <i>output</i> link. Router 1 sends packets toward B on link 2, so R is link 2's rate, 30 Mbps. a = 10 packets/s, L = 4000 bits.`,
 src:[S1(53)+' — traffic intensity = La/R', S1(31)+' — queue of packets waiting for transmission over output link']},
{id:'C3', set:'C', page:'8', ch:'1', type:'written', fig:'servers4',
 q:`Four servers are connected to four clients over four three-hop paths. The pairs share a common middle hop of capacity <b>R = 300 Mbps</b>. Each server link has <b>R<sub>S</sub> = 50 Mbps</b>; each client link has <b>R<sub>C</sub> = 90 Mbps</b>.<br><br>Assuming the servers all send at their maximum possible rate, what is the utilization of the <b>shared link</b> (capacity R)? Give 1.00 or 0.xx.`,
 answer:`Each pair gets min(R<sub>S</sub>, R/4, R<sub>C</sub>) = min(50, 75, 90) = 50 Mbps. Shared link carries 4 × 50 = 200 Mbps, so utilization = 200 / 300 = <b>0.67</b>`,
 exp:`The server links are the bottleneck, so each server can push at most 50 Mbps. Four flows together put 200 Mbps onto the 300 Mbps middle link.`,
 src:[S1(58)+' — per-connection throughput = min(R<sub>c</sub>, R<sub>s</sub>, R/N)', S1(53)+' — utilization / traffic intensity']},
{id:'C2', set:'C', page:'9', ch:'1', type:'written',
 q:`An internet <b>switch</b> involves the following layers of the TCP/IP layers:`,
 answer:`<b>Link (data link) and physical layers</b>`,
 exp:`A link-layer switch only looks at link-layer frames. In the end-to-end encapsulation figure, the switch's stack has just the link and physical layers, while the router also has the network layer.`,
 note:`The screenshot doesn't show the answer choices; pick the option that says "physical and data link layers".`,
 src:[S1(69)+' — switch: link + physical']},
{id:'C6', set:'C', page:'7', ch:'2', type:'written',
 q:`In HTTP web browser caching, HTTP local web server caching, and local DNS caching, a user benefits from finding a nearby copy. In which forms of caching does a user benefit not only from its own recent requests but <i>also from recent requests made by other users</i>?`,
 answer:`<b>HTTP local web server caching (the institution's web cache / proxy) and local DNS caching.</b> Browser caching only helps the user who made the request.`,
 exp:`A local web cache is shared: everyone in the institution points their browser at it, so an object fetched by one user is served from the cache to the next. The local DNS server is also shared by all hosts in the ISP or institution, and it caches every name-to-address mapping it learns. A browser cache lives on one user's own machine.`,
 note:`This was graded 0.5/1 on the screenshot, which suggests the full answer needs both shared caches.`,
 src:[S2(35)+' and '+S2(36).replace('Chapter 2 slides · ','')+' — Web caches: user configures browser to point to a local cache', S2(50)+' — local DNS server answers from its cache', S2(53)+' — any name server caches mappings it learns']},
{id:'C8', set:'C', page:'10', ch:'1', type:'match',
 q:`Match the description of each component of packet delay to its name.`,
 rows:['Time needed to perform an integrity check, look up packet information in a local table and move the packet from an input link to an output link in a router.','Time spent waiting in packet buffers for link transmission.','Time spent transmitting the packet\'s bits into the link.','Time needed for bits to physically propagate through the transmission medium from one end of a link to the other.'],
 choices:['Processing delay','Queueing delay','Transmission delay','Propagation delay'],
 ans:[0,1,2,3],
 answer:`Processing → Queueing → Transmission → Propagation (in the order listed)`,
 exp:`d<sub>proc</sub> checks bit errors and determines the output link. d<sub>queue</sub> is waiting at the output link. d<sub>trans</sub> = L/R pushes the bits out. d<sub>prop</sub> = d/s is travel time on the wire.`,
 src:[S1(49)+' — d<sub>proc</sub>, d<sub>queue</sub>', S1(50)+' — d<sub>trans</sub>, d<sub>prop</sub>']},

{id:'D3', set:'D', page:'12', ch:'2', type:'mcq', also:'7',

{id:'D4', set:'D', page:'13', ch:'1', type:'mcq', also:'41',

{id:'D6', set:'D', page:'15', ch:'1', type:'match', fig:'headers', also:'22',
 q:`The figure shows a link-layer frame heading from a host to a router, with three header fields H<sub>1</sub> H<sub>2</sub> H<sub>3</sub> in front of the message M. Match each header with its layer.`,
 rows:['Header H1','Header H2','Header H3'],
 choices:['A. Transport layer','B. Network layer','C. Link layer','D. Application layer','E. Physical layer'],
 ans:[2,1,0],
 answer:`H1 → C. Link · H2 → B. Network · H3 → A. Transport`,
 exp:`Encapsulation adds headers from the inside out: transport adds H<sub>t</sub> to M, network adds H<sub>n</sub> in front of that, and link adds H<sub>l</sub> outermost. A frame therefore reads H<sub>l</sub> H<sub>n</sub> H<sub>t</sub> M, so H1 is the link header and H3, the one next to M, is the transport header.`,
 note:`On PDF page 22 the saved choices are D, A, B. Those are wrong; the application layer adds no header in this figure.`,
 src:[S1(67)+' — link-layer frame [H<sub>l</sub> | H<sub>n</sub> | H<sub>t</sub> | M]', S1(68)+' — message, segment, datagram, frame']},
{id:'D7', set:'D', page:'16', ch:'2', type:'mcq', also:'11, 23, 24',
 q:`An HTTP/1.0 (non-persistent) client requests a base object from gaia.cs.umass.edu. It has never requested this object and has not communicated with the server recently, but it knows the server's IP address.<br><br>How many RTTs are needed from when the client first makes the request until the base page is completely downloaded, assuming the server needs <b>1/2 RTT to transmit the base file</b> into its link and the HTTP GET takes zero time to transmit? (Include TCP setup, the server's transmission time, and any propagation delays.)`,
 opts:['0 RTT','0.5 RTT','1.5 RTT','2.5 RTT','3.5 RTT'], ans:3,
 exp:`1 RTT for the TCP handshake + 1 RTT for the GET to reach the server and the first bits of the reply to come back + 0.5 RTT for the server to push the rest of the file = <b>2.5 RTT</b>. No DNS lookup is needed because the IP address is known.`,
 src:[S2(23)+' — non-persistent HTTP response time = 2RTT + file transmission time']},
{id:'D8', set:'D', page:'17', ch:'1', type:'mcq', also:'7, 39',

{id:'E1', set:'E', page:'19', ch:'1', type:'mcq', also:'39',
 q:`The amount of time required to push all of the packet's bits into the link is the:`,
 opts:['propagation delay','queuing delay','transmission delay','end-to-end delay'], ans:2,

{id:'E2', set:'E', page:'31', ch:'2', type:'mcq',
 q:`What is the purpose of the <i>If-Modified-Since</i> field in an HTTP GET request message?`,
 opts:['To indicate to the server that the server should replace this named object with the new version of the object attached to the GET, if the object has not been modified since the specified time.','To allow the server to indicate to the client that it (the client) should cache this object.','To inform the HTTP cache that it (the cache) should retrieve the full object from the server, and then cache it until the specified time.','To indicate to the server that the client has cached this object from a previous GET, and the time it was cached.','To indicate to the server that the client wishes to receive this object, and the time until which it will cache the returned object in the browser\'s cache.'],
 ans:3,
 exp:`In a conditional GET, the client puts the date of its cached copy in <code>If-modified-since</code>. The server then sends the object only if it changed after that date; otherwise it replies 304 Not Modified.`,

{id:'E3', set:'E', page:'20', ch:'1', type:'match',

{id:'E5', set:'E', page:'21', ch:'1', type:'mcq',

{id:'F3-2', set:'F', page:'33', ch:'2', type:'written',
 q:`2) Suppose 3 DNS servers are visited before your host receives the IP address from DNS, with RTTs of RTT<sub>1</sub>, RTT<sub>2</sub> and RTT<sub>3</sub>. The Web page contains exactly one small HTML object. RTT<sub>0</sub> is the RTT between the local host and the server containing the object. Assuming zero transmission time, how much time elapses from the click until the client receives the object?`,

{id:'G1-1', set:'G', page:'34', ch:'x', type:'mcq',

 opts:['To provide end-to-end processes communication','To deliver packets from the source to the destination.','To establish a connection between applications','To ensure reliable data transfer'], ans:1,

{id:'G1-2', set:'G', page:'34', ch:'x', type:'mcq',
 q:`What is a major difference between IPv4 and IPv6?`,

 exp:`IPv6 was created mainly because 32-bit IPv4 addresses were running out; it uses 128-bit addresses.`,

{id:'G1-3', set:'G', page:'34', ch:'x', type:'mcq',

{id:'G1-4', set:'G', page:'34', ch:'x', type:'mcq',
 q:`A datagram with destination IP address <b>10.1.1.10</b> arrives at a router. Which entry will the router use to route it?`,
 opts:['10.0.0.0/8','10.1.0.0/16','10.1.1.0/24'], ans:2,

{id:'G1-5', set:'G', page:'34', ch:'x', type:'mcq',

{id:'G1-6', set:'G', page:'34', ch:'x', type:'mcq',

{id:'G2-1', set:'G', page:'35', ch:'x', type:'written', fig:'tcp',
 q:`The figure shows TCP congestion control for TCP Reno and TCP Tahoe (fast recovery not used).<br><br>1) Identify the intervals of time when <b>slow start</b> is operating for TCP <b>Reno</b>.`,
 answer:`<b>Rounds 1 to 4</b> (cwnd 1 → 2 → 4 → 8)`,
 exp:`In slow start cwnd doubles every round. It reaches ssthresh = 8 at round 4, then grows by one segment per round. After the loss at round 8, Reno's line restarts at the new threshold (6) and grows linearly, so Reno does not enter slow start again in this figure.`,
 src:[OUT+', §3.7.1 TCP congestion control (Figure 3.53 is this graph)']},
{id:'G2-2', set:'G', page:'35', ch:'x', type:'written', fig:'tcp',
 q:`2) Identify the intervals of time when <b>congestion avoidance</b> is operating for TCP <b>Tahoe</b>.`,
 answer:`<b>Rounds 4 to 8</b> and <b>rounds 12 to 15</b>`,
 exp:`From round 4 (cwnd = ssthresh = 8) to the loss at round 8, cwnd grows linearly. After the loss Tahoe drops to 1 and slow-starts (1, 2, 4) until it reaches the new ssthresh of 6 at round 12, then grows linearly again.`,
 src:[OUT+', §3.7.1']},
{id:'G2-3', set:'G', page:'35', ch:'x', type:'written', fig:'tcp',
 q:`3) What is the value of the congestion window for TCP <b>Reno</b> at transmission round 7?`,
 answer:`<b>11 segments</b>`,
 exp:`8 at round 4, then +1 per round: 9, 10, 11 at round 7 (and 12 at round 8, where the loss happens).`,
 src:[OUT+', §3.7.1']},
{id:'G2-4', set:'G', page:'35', ch:'x', type:'written', fig:'tcp',
 q:`4) What is the value of the congestion window for TCP <b>Tahoe</b> at transmission round 11?`,
 answer:`<b>4 segments</b>`,
 exp:`Tahoe restarts at 1 in round 9, doubles to 2 in round 10 and 4 in round 11.`,
 src:[OUT+', §3.7.1']},
{id:'G2-5', set:'G', page:'35', ch:'x', type:'written', fig:'tcp',
 q:`5) What is the value of ssthresh at T = 1 for TCP <b>Reno</b>?`,
 answer:`<b>8</b>`,
 exp:`The initial threshold is the dashed line at 8: slow start stops and linear growth begins when cwnd reaches 8.`,
 src:[OUT+', §3.7.1']},
{id:'G2-6', set:'G', page:'35', ch:'x', type:'written', fig:'tcp',
 q:`6) What is the value of ssthresh at T = 9 for TCP <b>Tahoe</b>?`,
 answer:`<b>6</b>`,
 exp:`On loss, ssthresh is set to half of cwnd. cwnd was 12 when the loss happened in round 8, so ssthresh = 12 / 2 = 6 (the lower dashed line).`,
 src:[OUT+', §3.7.1']},

let study = false;

const LET = 'ABCDEFGH';
const chLabel = c => c === '1' ? 'Ch 1' : c === '2' ? 'Ch 2' : 'Beyond slides';
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function solutionHTML(q, verdict){
  let ans = q.answer;
  if (!ans && q.type === 'mcq') ans = `<b>${q.opts.length > 2 ? LET[q.ans] + '. ' : ''}${q.opts[q.ans]}</b>`;
  const v = verdict === 'ok' ? '<span class="verdict ok">Correct</span>'
          : verdict === 'bad' ? '<span class="verdict bad">Not quite</span>'
          : '<span class="verdict neutral">Solution</span>';
  const srcs = q.src.map(s => `<li class="${s.includes('Not in your Chapter') ? 'out' : ''}"><span>${s}</span></li>`).join('');
  return `<div class="sol">${v}
    <div class="ans"><span class="k">Answer</span><div class="tw">${ans}</div></div>
    <div class="why"><span class="k">Why</span>${q.exp}</div>
    ${q.note ? `<div class="note"><b class="k">Note</b>${q.note}</div>` : ''}
    <div class="srcs"><span class="k">Where this comes from</span><ul>${srcs}</ul></div>
  </div>`;
}

function cardHTML(q){
  const st = state[q.id] || {};
  const meta = `<div class="qmeta"><span class="id">${q.id}</span><span>PDF p.${q.page}</span>${q.also ? `<span>also on p.${q.also}</span>` : ''}<span class="tag ${q.ch === 'x' ? 'x' : ''}">${chLabel(q.ch)}</span></div>`;
  const fig = q.fig ? `<figure><img src="${IMG[q.fig]}" alt="Exam figure for question ${q.id}" loading="lazy"><figcaption>${FIGCAP[q.fig]}</figcaption></figure>` : '';
  const code = q.code ? `<pre class="cap">${esc(q.code)}</pre>` : '';
  const q2 = q.q2 ? `<div class="qtext">${q.q2}</div>` : '';
  let body = '', revealed = study || !!st.status;

  if (q.type === 'mcq') {
    const tf = q.opts.length === 2 && q.opts[0] === 'True';
    body = `<div class="opts ${tf ? 'tf' : ''}">` + q.opts.map((o, i) => {
      let cls = '';
      if (revealed) { if (i === q.ans) cls = 'right'; else if (st.choice === i) cls = 'wrong'; }
      return `<button class="opt ${cls}" data-i="${i}" ${revealed ? 'disabled' : ''}><span class="L">${tf ? o[0] : LET[i]}</span><span>${tf ? o : o}</span></button>`;
    }).join('') + `</div>`;
  } else if (q.type === 'match') {
    body = `<div class="match">` + q.rows.map((r, i) => {
      const sel = st.picks ? st.picks[i] : (revealed && study ? q.ans[i] : '');
      let cls = '', mk = '';
      if (revealed && st.picks) { const ok = st.picks[i] == q.ans[i]; cls = ok ? 'right' : 'wrong'; mk = ok ? '✓' : '✗'; }
      return `<div class="mrow ${cls}"><span>${r}</span><select id="m-${q.id}-${i}" aria-label="Match for ${esc(r)}" ${revealed ? 'disabled' : ''}><option value="">Choose…</option>${q.choices.map((c, j) => `<option value="${j}" ${String(sel) === String(j) ? 'selected' : ''}>${c}</option>`).join('')}</select><span class="mk">${mk}</span></div>`;
    }).join('') + `</div>` + (revealed ? '' : `<div class="actions"><button class="btn" data-act="check">Check answers</button><span class="hint" data-hint></span></div>`);
  } else {
    body = `<textarea id="w-${q.id}" placeholder="Work it out here (optional), then reveal the solution." ${st.status && st.status !== 'shown' ? 'readonly' : ''}>${st.text ? esc(st.text) : ''}</textarea>`;
    if (!st.status && !study) body += `<div class="actions"><button class="btn" data-act="reveal">Show solution</button></div>`;
    else if (st.status === 'shown') body += `<div class="actions"><span class="hint">Did you get it?</span><button class="btn ok" data-act="selfok">I got it right</button><button class="btn bad" data-act="selfbad">I missed it</button></div>`;
  }

  let verdict = null;
  if (st.status === 'ok') verdict = 'ok'; else if (st.status === 'bad') verdict = 'bad';
  const cls = verdict === 'ok' ? 'is-ok' : verdict === 'bad' ? 'is-bad' : '';
  return `<article class="q ${cls}" id="q-${q.id}" data-id="${q.id}">${meta}<div class="qtext">${q.q}</div>${fig}${code}${q2}${body}${revealed ? solutionHTML(q, verdict) : ''}</article>`;
}

const END = '__end';
let curId = null;
try { curId = localStorage.getItem(KEY + '-pos'); } catch (e) {}
const savePos = () => { try { localStorage.setItem(KEY + '-pos', curId || ''); } catch (e) {} };

const stOf = id => state[id] || {};
const graded = id => ['ok','bad'].includes(stOf(id).status);
const solved = id => study || !!stOf(id).status;

function visible(q){
  const st = stOf(q.id);
  if (filter === 'all') return true;
  if (filter === 'todo') return !graded(q.id);
  if (filter === 'wrong') return st.status === 'bad';
  return q.ch === filter;
}
/* Questions in paper order. The question on screen stays in the list while you're on it,
   so answering it under "Not answered yet" doesn't make it vanish before you press Next. */
function list(){
  const order = [];
  SETS.forEach(s => Q.forEach(q => { if (q.set === s.id && (visible(q) || q.id === curId)) order.push(q); }));
  return order;
}

function stageHTML(L, i){
  const q = L[i], s = SETS.find(x => x.id === q.set);
  const done = solved(q.id), last = i === L.length - 1;
  return `<div class="where"><div class="paper"><div class="eyebrow">Paper ${s.id} · PDF pages ${s.pages}</div><h2>${s.name}</h2></div>
      <div class="pos">Question <b>${i + 1}</b> of ${L.length}</div></div>
    ${q.set === 'G' ? '<div class="warnline">This paper covers Chapters 3–4 (TCP, IP addressing, NAT), which are not in your slides or tutorial. Answers come from the same textbook.</div>' : ''}
    ${cardHTML(q)}
    <div class="stepper">
      <button class="btn sec" data-nav="prev" ${i === 0 ? 'disabled' : ''}>← Previous</button>
      <div class="right">
        ${done ? '' : `<button class="skip" data-nav="next">Skip for now</button>`}
        <button class="btn big" data-nav="next" ${done ? '' : 'disabled'} title="${done ? '' : 'Answer the question first'}">${last ? 'Finish' : 'Next question →'}</button>
      </div>
    </div>
    <div class="kbd">Tip: ← and → keys move between questions once you've answered.</div>`;
}

function endHTML(L){
  const rows = SETS.map(s => {
    const qs = Q.filter(q => q.set === s.id);
    const g = qs.filter(q => graded(q.id)).length, r = qs.filter(q => stOf(q.id).status === 'ok').length;
    return `<tr><td><b>${s.id}</b> · ${s.name}</td><td>${r} / ${g}</td><td>${qs.length}</td></tr>`;
  }).join('');
  const missed = Q.filter(q => stOf(q.id).status === 'bad').length;
  return `<div class="endcard"><div class="eyebrow">End of this list</div><h2>${L.length ? 'You reached the last question.' : 'No questions match this filter.'}</h2>
    <div class="tw"><table><tr><th>Paper</th><th>Correct / answered</th><th>Questions</th></tr>${rows}</table></div>
    <div class="actions"><button class="btn" data-nav="restart">Back to question 1</button>
    ${missed ? `<button class="btn sec" data-nav="missed">Review the ${missed} I missed</button>` : ''}
    ${filter !== 'all' ? `<button class="btn sec" data-nav="all">Show all questions</button>` : ''}</div></div>`;
}

function render(){
  const L = list();
  if (curId !== END && !L.some(q => q.id === curId)) curId = L.length ? L[0].id : END;
  const i = L.findIndex(q => q.id === curId);
  document.getElementById('main').innerHTML = curId === END ? endHTML(L) : stageHTML(L, i);
  renderMap(L); renderScore(); savePos();
}

function renderMap(L){
  let n = 0, html = '<div class="lbl">Question map</div>';
  SETS.forEach(s => {
    const qs = L.filter(q => q.set === s.id);
    if (!qs.length) return;
    const g = qs.filter(q => graded(q.id)).length;
    html += `<div class="mp"><div class="mp-h"><span><span class="k">${s.id}</span>${s.name.split(' · ')[0]}</span><span class="n">${g}/${qs.length}</span></div><div class="dots">` +
      qs.map(q => { n++; const st = stOf(q.id).status;
        const c = st === 'ok' ? 'ok' : st === 'bad' ? 'bad' : st === 'shown' ? 'shown' : '';
        return `<button class="dot ${c} ${q.id === curId ? 'cur' : ''}" data-go="${q.id}" aria-label="Question ${n}, ${q.id}${c ? ', ' + c : ''}">${n}</button>`; }).join('') + `</div></div>`;
  });
  html += '<div class="legend"><span><i class="l-ok"></i>Correct</span><span><i class="l-bad"></i>Missed</span><span><i class="l-sh"></i>Solution shown</span></div>';
  document.getElementById('map').innerHTML = html;
}

function renderScore(){
  const done = Q.filter(q => graded(q.id)).length;
  const right = Q.filter(q => stOf(q.id).status === 'ok').length;
  document.getElementById('s-done').textContent = done;
  document.getElementById('s-right').textContent = right;
  document.getElementById('s-total').textContent = Q.length;
  document.getElementById('s-bar').style.width = (100 * done / Q.length) + '%';
}

function go(id){
  curId = id; render();
  const m = document.getElementById('main');
  if (m.getBoundingClientRect().top < 0) m.scrollIntoView({block:'start'});
  const h = m.querySelector('.qtext'); if (h) { h.setAttribute('tabindex','-1'); h.focus({preventScroll:true}); }
}
function step(d){
  const L = list(), i = L.findIndex(q => q.id === curId);
  if (curId === END) { if (d < 0 && L.length) go(L[L.length - 1].id); return; }
  const j = i + d;
  if (j < 0) return;
  go(j >= L.length ? END : L[j].id);
}

document.getElementById('main').addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]');
  if (nav && !nav.disabled) {
    const a = nav.dataset.nav;
    if (a === 'next') step(1); else if (a === 'prev') step(-1);
    else if (a === 'restart') { const L = list(); go(L.length ? L[0].id : END); }
    else if (a === 'missed' || a === 'all') { setFilter(a === 'missed' ? 'wrong' : 'all'); }
    return;
  }
  const card = e.target.closest('article.q'); if (!card) return;
  const id = card.dataset.id, q = Q.find(x => x.id === id);
  const opt = e.target.closest('.opt');
  if (opt && !opt.disabled) {
    const i = +opt.dataset.i;
    state[id] = {status: i === q.ans ? 'ok' : 'bad', choice: i}; save(); render(); return;
  }
  const act = e.target.closest('[data-act]'); if (!act) return;
  const a = act.dataset.act;
  if (a === 'check') {
    const picks = q.rows.map((_, i) => card.querySelector(`#m-${id}-${i}`).value);
    if (picks.some(p => p === '')) { card.querySelector('[data-hint]').textContent = 'Pick a match for every row first.'; return; }
    const all = picks.every((p, i) => +p === q.ans[i]);
    state[id] = {status: all ? 'ok' : 'bad', picks: picks.map(Number)}; save(); render();
  } else if (a === 'reveal') {
    const t = card.querySelector('textarea'); state[id] = {status: 'shown', text: t ? t.value : ''}; save(); render();
  } else if (a === 'selfok' || a === 'selfbad') {
    const t = card.querySelector('textarea');
    state[id] = {status: a === 'selfok' ? 'ok' : 'bad', text: t ? t.value : stOf(id).text}; save(); render();
  }
});
document.getElementById('map').addEventListener('click', e => { const d = e.target.closest('[data-go]'); if (d) go(d.dataset.go); });

document.addEventListener('keydown', e => {
  if (e.target.closest('textarea, select, input') || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === 'ArrowRight' && curId !== END && solved(curId)) { e.preventDefault(); step(1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
});

function setFilter(f){
  filter = f;
  document.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.f === f)));
  if (curId === END) curId = null;
  const prev = curId; curId = null;            // drop the pin so the filter applies cleanly
  const L = list();
  curId = L.some(q => q.id === prev) ? prev : (L.length ? L[0].id : END);
  render();
}
document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => setFilter(c.dataset.f)));
document.getElementById('study').addEventListener('change', e => { study = e.target.checked; render(); });

function wireReset(){
  document.getElementById('reset').addEventListener('click', () => {
    const box = document.getElementById('resetbox');
    box.innerHTML = '<span class="confirm">Clear all answers? <button class="ghost" id="r-yes">Clear</button><button class="ghost" id="r-no">Keep</button></span>';
    document.getElementById('r-yes').onclick = () => { state = {}; save(); curId = null; restore(); render(); };
    document.getElementById('r-no').onclick = restore;
  });
}
function restore(){ document.getElementById('resetbox').innerHTML = '<button class="ghost" id="reset">Reset progress</button>'; wireReset(); }
wireReset();
render();
</script>

</body>
</html>
